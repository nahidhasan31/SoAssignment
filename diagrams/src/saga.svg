<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#10213a"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7d"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9b1c2e"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8a6a14"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#16365c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5d3a"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a7b1f"/></marker></defs>
<rect width="880" height="560" fill="white"/>
<rect x="0" y="0" width="880" height="560" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<rect x="24" y="16" width="832" height="24" fill="#10213a"/>
<text x="440.0" y="33" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">The place-order process manager, as declared in OrderStateMachine.cs</text>
<rect x="24" y="68" width="150" height="58" rx="0" fill="#ffffff" stroke="#5d6b7d" stroke-width="1.8"/>
<rect x="24" y="68" width="150" height="22" fill="#5d6b7d"/>
<line x1="24" y1="90" x2="174" y2="90" stroke="#5d6b7d" stroke-width="1.8"/>
<text x="99.0" y="82" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Initially</text>
<text x="99.0" y="109" font-size="10" text-anchor="middle" fill="#10213a">OrderSubmitted</text>
<rect x="236" y="68" width="150" height="58" rx="0" fill="#ffffff" stroke="#9b1c2e" stroke-width="1.8"/>
<rect x="236" y="68" width="150" height="22" fill="#9b1c2e"/>
<line x1="236" y1="90" x2="386" y2="90" stroke="#9b1c2e" stroke-width="1.8"/>
<text x="311.0" y="82" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Reserving</text>
<text x="311.0" y="109" font-size="10" text-anchor="middle" fill="#10213a">send ReserveStock</text>
<rect x="448" y="68" width="150" height="58" rx="0" fill="#ffffff" stroke="#9b1c2e" stroke-width="1.8"/>
<rect x="448" y="68" width="150" height="22" fill="#9b1c2e"/>
<line x1="448" y1="90" x2="598" y2="90" stroke="#9b1c2e" stroke-width="1.8"/>
<text x="523.0" y="82" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Authorising</text>
<text x="523.0" y="109" font-size="10" text-anchor="middle" fill="#10213a">send AuthorisePayment</text>
<rect x="660" y="68" width="196" height="58" rx="0" fill="#ffffff" stroke="#1f5d3a" stroke-width="1.8"/>
<rect x="660" y="68" width="196" height="22" fill="#1f5d3a"/>
<line x1="660" y1="90" x2="856" y2="90" stroke="#1f5d3a" stroke-width="1.8"/>
<text x="758.0" y="82" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Confirmed</text>
<text x="758.0" y="109" font-size="10" text-anchor="middle" fill="#10213a">publish OrderConfirmed</text>
<line x1="176" y1="97" x2="234" y2="97" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<text x="205.0" y="79" font-size="8.5" text-anchor="middle" fill="#5d6b7d">Order</text>
<text x="205.0" y="89" font-size="8.5" text-anchor="middle" fill="#5d6b7d">Submitted</text>
<line x1="388" y1="97" x2="446" y2="97" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<text x="417.0" y="79" font-size="8.5" text-anchor="middle" fill="#5d6b7d">Stock</text>
<text x="417.0" y="89" font-size="8.5" text-anchor="middle" fill="#5d6b7d">Reserved</text>
<line x1="600" y1="97" x2="658" y2="97" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<text x="629.0" y="79" font-size="8.5" text-anchor="middle" fill="#5d6b7d">Payment</text>
<text x="629.0" y="89" font-size="8.5" text-anchor="middle" fill="#5d6b7d">Authorised</text>
<rect x="448" y="176" width="150" height="58" rx="0" fill="#fbeef0" stroke="#9b1c2e" stroke-width="1.8"/>
<rect x="448" y="176" width="150" height="22" fill="#9b1c2e"/>
<line x1="448" y1="198" x2="598" y2="198" stroke="#9b1c2e" stroke-width="1.8"/>
<text x="523.0" y="190" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Compensating</text>
<text x="523.0" y="217" font-size="10" text-anchor="middle" fill="#10213a">send ReleaseStock</text>
<line x1="523" y1="126" x2="523" y2="174" stroke="#9b1c2e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="533" y="154" font-size="9" text-anchor="start" fill="#9b1c2e">PaymentDeclined</text>
<rect x="660" y="176" width="196" height="58" rx="0" fill="#ffffff" stroke="#9b1c2e" stroke-width="1.8"/>
<rect x="660" y="176" width="196" height="22" fill="#9b1c2e"/>
<line x1="660" y1="198" x2="856" y2="198" stroke="#9b1c2e" stroke-width="1.8"/>
<text x="758.0" y="190" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Cancelled</text>
<text x="758.0" y="217" font-size="10" text-anchor="middle" fill="#10213a">publish OrderCancelled</text>
<line x1="600" y1="205" x2="658" y2="205" stroke="#9b1c2e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="629.0" y="187" font-size="8.5" text-anchor="middle" fill="#9b1c2e">Stock</text>
<text x="629.0" y="197" font-size="8.5" text-anchor="middle" fill="#9b1c2e">Released</text>
<rect x="236" y="176" width="150" height="58" rx="0" fill="#ffffff" stroke="#9b1c2e" stroke-width="1.8"/>
<rect x="236" y="176" width="150" height="22" fill="#9b1c2e"/>
<line x1="236" y1="198" x2="386" y2="198" stroke="#9b1c2e" stroke-width="1.8"/>
<text x="311.0" y="190" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Rejected</text>
<text x="311.0" y="217" font-size="10" text-anchor="middle" fill="#10213a">publish OrderCancelled</text>
<line x1="311" y1="126" x2="311" y2="174" stroke="#9b1c2e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="321" y="154" font-size="9" text-anchor="start" fill="#9b1c2e">StockRejected</text>
<rect x="24" y="252" width="832" height="24" fill="#9a7b1f"/>
<text x="440.0" y="269" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">What the framework supplies, so that the file above holds only the sequence</text>
<rect x="24" y="292" width="180" height="26" rx="0" fill="#eef2f7" stroke="#10213a" stroke-width="1.0"/>
<text x="114" y="310" font-size="11" text-anchor="middle" fill="#10213a" font-weight="bold">Correlation</text>
<rect x="204" y="292" width="652" height="26" rx="0" fill="#ffffff" stroke="#10213a" stroke-width="1.0"/>
<text x="216" y="310" font-size="10.5" text-anchor="start" fill="#10213a">every message carries the order id; MassTransit finds the one instance, or none</text>
<rect x="24" y="322" width="180" height="26" rx="0" fill="#eef2f7" stroke="#10213a" stroke-width="1.0"/>
<text x="114" y="340" font-size="11" text-anchor="middle" fill="#10213a" font-weight="bold">Concurrency</text>
<rect x="204" y="322" width="652" height="26" rx="0" fill="#ffffff" stroke="#10213a" stroke-width="1.0"/>
<text x="216" y="340" font-size="10.5" text-anchor="start" fill="#10213a">the instance row is locked while a message is handled, so two cannot interleave</text>
<rect x="24" y="352" width="180" height="26" rx="0" fill="#eef2f7" stroke="#10213a" stroke-width="1.0"/>
<text x="114" y="370" font-size="11" text-anchor="middle" fill="#10213a" font-weight="bold">Persistence</text>
<rect x="204" y="352" width="652" height="26" rx="0" fill="#ffffff" stroke="#10213a" stroke-width="1.0"/>
<text x="216" y="370" font-size="10.5" text-anchor="start" fill="#10213a">Entity Framework saga repository on the orchestration database</text>
<rect x="24" y="382" width="180" height="26" rx="0" fill="#eef2f7" stroke="#10213a" stroke-width="1.0"/>
<text x="114" y="400" font-size="11" text-anchor="middle" fill="#10213a" font-weight="bold">Resilience</text>
<rect x="204" y="382" width="652" height="26" rx="0" fill="#ffffff" stroke="#10213a" stroke-width="1.0"/>
<text x="216" y="400" font-size="10.5" text-anchor="start" fill="#10213a">retry (3 × 2 s), delayed redelivery (10 s, 30 s), then the error queue</text>
<rect x="24" y="412" width="180" height="26" rx="0" fill="#eef2f7" stroke="#10213a" stroke-width="1.0"/>
<text x="114" y="430" font-size="11" text-anchor="middle" fill="#10213a" font-weight="bold">Commands vs events</text>
<rect x="204" y="412" width="652" height="26" rx="0" fill="#ffffff" stroke="#10213a" stroke-width="1.0"/>
<text x="216" y="430" font-size="10.5" text-anchor="start" fill="#10213a">Send names one endpoint; Publish fans out to every subscription</text>
<rect x="24" y="442" width="180" height="26" rx="0" fill="#eef2f7" stroke="#10213a" stroke-width="1.0"/>
<text x="114" y="460" font-size="11" text-anchor="middle" fill="#10213a" font-weight="bold">Testing</text>
<rect x="204" y="442" width="652" height="26" rx="0" fill="#ffffff" stroke="#10213a" stroke-width="1.0"/>
<text x="216" y="460" font-size="10.5" text-anchor="start" fill="#10213a">an in-memory harness runs every branch of this diagram in about two seconds</text>
<text x="440" y="500" font-size="11" text-anchor="middle" fill="#5d6b7d" font-style="italic">Nothing is rolled back. ReleaseStock is an ordinary command whose handler is safe to run twice and safe to run</text>
<text x="440" y="518" font-size="11" text-anchor="middle" fill="#5d6b7d" font-style="italic">when nothing was ever held — which is what makes the compensating path as reliable as the happy one.</text>
<text x="440" y="544" font-size="11" text-anchor="middle" fill="#5d6b7d" font-style="italic">Finished instances are kept, so support can read the whole path from one row.</text>
</svg>
