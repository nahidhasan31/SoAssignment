<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="Gill Sans, Gill Sans MT, sans-serif">
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#1b2a3a"/></marker><marker id="m-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#7d8c9c"/></marker><marker id="m-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#5f7183"/></marker><marker id="m-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#b4820e"/></marker><marker id="m-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#8c2f22"/></marker></defs>
<rect width="880" height="540" fill="white"/>
<text x="24" y="26" font-size="13" text-anchor="start" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">The process manager, as OrderStateMachine.cs declares it</text>
<rect x="24" y="44" width="150" height="50" fill="#ffffff" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="99.0" y="63" font-size="12.5" text-anchor="middle" fill="#7d8c9c" font-family="Rockwell, Georgia, serif" font-weight="600">Initially</text>
<rect x="236" y="44" width="150" height="50" fill="#ffffff" stroke="#1b2a3a" stroke-width="2.6"/>
<text x="311.0" y="63" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Reserving</text>
<text x="311.0" y="80" font-size="10.5" text-anchor="middle" fill="#5f7183">sends ReserveStock</text>
<rect x="448" y="44" width="150" height="50" fill="#ffffff" stroke="#1b2a3a" stroke-width="2.6"/>
<text x="523.0" y="63" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Authorising</text>
<text x="523.0" y="80" font-size="10.5" text-anchor="middle" fill="#5f7183">sends AuthorisePayment</text>
<rect x="660" y="44" width="196" height="50" fill="#ffffff" stroke="#1b2a3a" stroke-width="2.6"/>
<text x="758.0" y="63" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Confirmed</text>
<text x="758.0" y="80" font-size="10.5" text-anchor="middle" fill="#5f7183">publishes OrderConfirmed</text>
<line x1="174" y1="69" x2="232" y2="69" stroke="#1b2a3a" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-ink)"/>
<text x="203.0" y="52.0" font-size="8" text-anchor="middle" fill="#5f7183">Order</text>
<text x="203.0" y="61.5" font-size="8" text-anchor="middle" fill="#5f7183">Submitted</text>
<line x1="386" y1="69" x2="444" y2="69" stroke="#1b2a3a" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-ink)"/>
<text x="415.0" y="52.0" font-size="8" text-anchor="middle" fill="#5f7183">Stock</text>
<text x="415.0" y="61.5" font-size="8" text-anchor="middle" fill="#5f7183">Reserved</text>
<line x1="598" y1="69" x2="656" y2="69" stroke="#1b2a3a" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-ink)"/>
<text x="627.0" y="52.0" font-size="8" text-anchor="middle" fill="#5f7183">Payment</text>
<text x="627.0" y="61.5" font-size="8" text-anchor="middle" fill="#5f7183">Authorised</text>
<rect x="448" y="136" width="150" height="50" fill="#ffffff" stroke="#8c2f22" stroke-width="1.2"/>
<text x="523.0" y="155" font-size="12.5" text-anchor="middle" fill="#8c2f22" font-family="Rockwell, Georgia, serif" font-weight="600">Compensating</text>
<text x="523.0" y="172" font-size="10.5" text-anchor="middle" fill="#5f7183">sends ReleaseStock</text>
<line x1="523" y1="94" x2="523" y2="132" stroke="#8c2f22" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-fault)"/>
<text x="533" y="118" font-size="8.5" text-anchor="start" fill="#8c2f22">PaymentDeclined</text>
<rect x="660" y="136" width="196" height="50" fill="#ffffff" stroke="#8c2f22" stroke-width="1.2"/>
<text x="758.0" y="155" font-size="12.5" text-anchor="middle" fill="#8c2f22" font-family="Rockwell, Georgia, serif" font-weight="600">Cancelled</text>
<text x="758.0" y="172" font-size="10.5" text-anchor="middle" fill="#5f7183">publishes OrderCancelled</text>
<line x1="598" y1="161" x2="656" y2="161" stroke="#8c2f22" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-fault)"/>
<text x="627" y="152" font-size="8.5" text-anchor="middle" fill="#8c2f22">StockReleased</text>
<rect x="236" y="136" width="150" height="50" fill="#ffffff" stroke="#8c2f22" stroke-width="1.2"/>
<text x="311.0" y="155" font-size="12.5" text-anchor="middle" fill="#8c2f22" font-family="Rockwell, Georgia, serif" font-weight="600">Rejected</text>
<text x="311.0" y="172" font-size="10.5" text-anchor="middle" fill="#5f7183">publishes OrderCancelled</text>
<line x1="311" y1="94" x2="311" y2="132" stroke="#8c2f22" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-fault)"/>
<text x="321" y="118" font-size="8.5" text-anchor="start" fill="#8c2f22">StockRejected</text>
<line x1="24" y1="216" x2="856" y2="216" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="240" font-size="12" text-anchor="start" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">What the framework supplies, so the file above holds only the sequence</text>
<line x1="24" y1="282" x2="856" y2="282" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="276" font-size="10.5" text-anchor="start" fill="#1b2a3a" font-weight="600">Correlation</text>
<text x="224" y="276" font-size="10.5" text-anchor="start" fill="#5f7183">every message carries the order id, so MassTransit finds one instance or none</text>
<line x1="24" y1="310" x2="856" y2="310" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="304" font-size="10.5" text-anchor="start" fill="#1b2a3a" font-weight="600">Concurrency</text>
<text x="224" y="304" font-size="10.5" text-anchor="start" fill="#5f7183">the instance row is locked while a message is handled; two cannot interleave</text>
<line x1="24" y1="338" x2="856" y2="338" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="332" font-size="10.5" text-anchor="start" fill="#1b2a3a" font-weight="600">Persistence</text>
<text x="224" y="332" font-size="10.5" text-anchor="start" fill="#5f7183">an Entity Framework saga repository on the orchestration database</text>
<line x1="24" y1="366" x2="856" y2="366" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="360" font-size="10.5" text-anchor="start" fill="#1b2a3a" font-weight="600">Resilience</text>
<text x="224" y="360" font-size="10.5" text-anchor="start" fill="#5f7183">retry three times at two seconds, redelivery at ten and thirty, then the error queue</text>
<line x1="24" y1="394" x2="856" y2="394" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="388" font-size="10.5" text-anchor="start" fill="#1b2a3a" font-weight="600">Commands and events</text>
<text x="224" y="388" font-size="10.5" text-anchor="start" fill="#5f7183">Send names one endpoint; Publish reaches every subscription</text>
<line x1="24" y1="422" x2="856" y2="422" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="416" font-size="10.5" text-anchor="start" fill="#1b2a3a" font-weight="600">Testing</text>
<text x="224" y="416" font-size="10.5" text-anchor="start" fill="#5f7183">an in-memory harness runs every branch above in about two seconds</text>
<text x="24" y="456" font-size="10.5" text-anchor="start" fill="#5f7183" font-style="italic">Nothing is rolled back. ReleaseStock is an ordinary command whose handler is safe to run twice,</text>
<text x="24" y="472" font-size="10.5" text-anchor="start" fill="#5f7183" font-style="italic">and safe when nothing was ever held, which is what makes the compensating path as reliable as the happy one.</text>
<rect x="560" y="492" width="296" height="38" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="568" y="506" font-size="8.5" text-anchor="start" fill="#5f7183">figure</text>
<text x="568" y="521" font-size="11" text-anchor="start" fill="#1b2a3a">4</text>
<line x1="607.36" y1="492" x2="607.36" y2="530" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="615.36" y="506" font-size="8.5" text-anchor="start" fill="#5f7183">shows</text>
<text x="615.36" y="521" font-size="11" text-anchor="start" fill="#1b2a3a">Place-order process manager</text>
<line x1="790.88" y1="492" x2="790.88" y2="530" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="798.88" y="506" font-size="8.5" text-anchor="start" fill="#5f7183">revision</text>
<text x="798.88" y="521" font-size="11" text-anchor="start" fill="#1b2a3a">D</text>
</svg>
