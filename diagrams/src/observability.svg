<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Gill Sans, Gill Sans MT, sans-serif">
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#1b2a3a"/></marker><marker id="m-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#7d8c9c"/></marker><marker id="m-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#5f7183"/></marker><marker id="m-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#b4820e"/></marker><marker id="m-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#8c2f22"/></marker></defs>
<rect width="880" height="470" fill="white"/>
<text x="70" y="26" font-size="11.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Order</text>
<line x1="70" y1="36" x2="440" y2="78" stroke="#1b2a3a" stroke-width="0.8" stroke-dasharray="1.5 3" marker-end="url(#m-ink)"/>
<text x="242" y="26" font-size="11.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Orchestration</text>
<line x1="242" y1="36" x2="440" y2="78" stroke="#1b2a3a" stroke-width="0.8" stroke-dasharray="1.5 3" marker-end="url(#m-ink)"/>
<text x="414" y="26" font-size="11.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Inventory</text>
<line x1="414" y1="36" x2="440" y2="78" stroke="#1b2a3a" stroke-width="0.8" stroke-dasharray="1.5 3" marker-end="url(#m-ink)"/>
<text x="586" y="26" font-size="11.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Payment</text>
<line x1="586" y1="36" x2="440" y2="78" stroke="#1b2a3a" stroke-width="0.8" stroke-dasharray="1.5 3" marker-end="url(#m-ink)"/>
<text x="758" y="26" font-size="11.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Notification</text>
<line x1="758" y1="36" x2="440" y2="78" stroke="#1b2a3a" stroke-width="0.8" stroke-dasharray="1.5 3" marker-end="url(#m-ink)"/>
<text x="24" y="62" font-size="10" text-anchor="start" fill="#5f7183" font-style="italic">OpenTelemetry spans, so the instrumentation outlives the vendor</text>
<rect x="216" y="82" width="448" height="50" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="440.0" y="101" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">OneAgent operator</text>
<text x="440.0" y="118" font-size="10.5" text-anchor="middle" fill="#5f7183">injected into every pod; the service map is discovered from the mesh</text>
<line x1="440" y1="132" x2="440" y2="154" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#m-ink)"/>
<rect x="216" y="158" width="448" height="50" fill="#ffffff" stroke="#b4820e" stroke-width="1.2"/>
<text x="440.0" y="177" font-size="12.5" text-anchor="middle" fill="#b4820e" font-family="Rockwell, Georgia, serif" font-weight="600">Davis</text>
<text x="440.0" y="194" font-size="10.5" text-anchor="middle" fill="#5f7183">one problem with a probable cause, not four dashboards to correlate</text>
<line x1="24" y1="240" x2="856" y2="240" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="266" font-size="12.5" text-anchor="start" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Two objectives, because availability and speed fail differently</text>
<rect x="24" y="286" width="404" height="128" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="226.0" y="305" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Availability</text>
<text x="226" y="324" font-size="10.5" text-anchor="middle" fill="#5f7183">99.9 per cent of checkout answers 2xx, over ninety days</text>
<text x="226" y="340" font-size="10.5" text-anchor="middle" fill="#5f7183">an error budget of 2 hours 9 minutes a quarter</text>
<text x="226" y="356" font-size="10.5" text-anchor="middle" fill="#5f7183"></text>
<text x="226" y="372" font-size="10.5" text-anchor="middle" fill="#5f7183">burning it 14.4 times too fast for five minutes pages</text>
<text x="226" y="388" font-size="10.5" text-anchor="middle" fill="#5f7183">the on-call engineer; six times for an hour reaches Slack</text>
<rect x="452" y="286" width="404" height="128" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="654.0" y="305" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Latency</text>
<text x="654" y="324" font-size="10.5" text-anchor="middle" fill="#5f7183">the 99th percentile answers in 2,000 ms or less</text>
<text x="654" y="340" font-size="10.5" text-anchor="middle" fill="#5f7183">measured at the ingress, not inside the service</text>
<text x="654" y="356" font-size="10.5" text-anchor="middle" fill="#5f7183"></text>
<text x="654" y="372" font-size="10.5" text-anchor="middle" fill="#5f7183">the case's own failure was latency, not availability:</text>
<text x="654" y="388" font-size="10.5" text-anchor="middle" fill="#5f7183">checkout queued long before any request actually failed</text>
<rect x="560" y="424" width="296" height="38" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="568" y="438" font-size="8.5" text-anchor="start" fill="#5f7183">figure</text>
<text x="568" y="453" font-size="11" text-anchor="start" fill="#1b2a3a">3</text>
<line x1="607.36" y1="424" x2="607.36" y2="462" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="615.36" y="438" font-size="8.5" text-anchor="start" fill="#5f7183">shows</text>
<text x="615.36" y="453" font-size="11" text-anchor="start" fill="#1b2a3a">Telemetry and objectives</text>
<line x1="790.88" y1="424" x2="790.88" y2="462" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="798.88" y="438" font-size="8.5" text-anchor="start" fill="#5f7183">revision</text>
<text x="798.88" y="453" font-size="11" text-anchor="start" fill="#1b2a3a">B</text>
</svg>
