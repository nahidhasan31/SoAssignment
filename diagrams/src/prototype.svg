<rect x="24" y="190" width="832" height="52" fill="#ffffff" stroke="#b4820e" stroke-width="1.2"/>
<text x="440.0" y="209" font-size="12.5" text-anchor="middle" fill="#b4820e" font-family="Rockwell, Georgia, serif" font-weight="600">RabbitMQ</text>
<text x="440.0" y="226" font-size="10.5" text-anchor="middle" fill="#5f7183">six endpoint queues, one error queue each, and a fanout exchange per message type</text>
<text x="440.0" y="240" font-size="10.5" text-anchor="middle" fill="#5f7183">Azure Service Bus in production: the same code, one line of configuration</text>
<line x1="24" y1="272" x2="856" y2="272" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="296" font-size="11.5" text-anchor="start" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">What it shows</text>
<text x="24" y="318" font-size="10.5" text-anchor="start" fill="#5f7183">checkout answers in about 70 ms, and keeps answering</text>
<text x="24" y="334" font-size="10.5" text-anchor="start" fill="#5f7183">while the notification service is stopped</text>
<text x="24" y="350" font-size="10.5" text-anchor="start" fill="#5f7183">the saga's own row shows the path an order took</text>
<text x="24" y="366" font-size="10.5" text-anchor="start" fill="#5f7183">a declined card sends ReleaseStock and the hold returns</text>
<text x="24" y="382" font-size="10.5" text-anchor="start" fill="#5f7183">one correlation identifier runs through all five services</text>
<line x1="440" y1="282" x2="440" y2="400" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="464" y="296" font-size="11.5" text-anchor="start" fill="#8c2f22" font-family="Rockwell, Georgia, serif" font-weight="600">What it does not</text>
<text x="464" y="318" font-size="10.5" text-anchor="start" fill="#5f7183">no scheduled timeout, so a worker that never answers</text>
<text x="464" y="334" font-size="10.5" text-anchor="start" fill="#5f7183">leaves the saga open; that is the first gap to close</text>
<text x="464" y="350" font-size="10.5" text-anchor="start" fill="#5f7183">RabbitMQ locally, not Azure Service Bus</text>
<text x="464" y="366" font-size="10.5" text-anchor="start" fill="#5f7183">no cluster, no mesh, no ingress, no Argo CD</text>
<text x="464" y="382" font-size="10.5" text-anchor="start" fill="#5f7183">no load test; 70 ms is one request on an idle machine</text>
</svg>
