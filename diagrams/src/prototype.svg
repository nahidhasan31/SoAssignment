<text x="440.0" y="210" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">RabbitMQ 3.13 — the transport, locally</text>
<text x="440.0" y="237" font-size="10.5" text-anchor="middle" fill="#10213a">six endpoint queues, one error queue each, and a fanout exchange per message type</text>
<text x="440.0" y="252" font-size="10.5" text-anchor="middle" fill="#10213a">Azure Service Bus in production: the same code, one configuration line</text>
<rect x="24" y="278" width="404" height="142" rx="0" fill="#ffffff" stroke="#1f5d3a" stroke-width="1.8"/>
<rect x="24" y="278" width="404" height="24" fill="#1f5d3a"/>
<line x1="24" y1="302" x2="428" y2="302" stroke="#1f5d3a" stroke-width="1.8"/>
<text x="226.0" y="294" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">what the prototype proves</text>
<text x="226.0" y="321" font-size="10" text-anchor="middle" fill="#10213a">checkout answers in ~70 ms and keeps answering while</text>
<text x="226.0" y="336" font-size="10" text-anchor="middle" fill="#10213a">the notification service is stopped</text>
<text x="226.0" y="351" font-size="10" text-anchor="middle" fill="#10213a">the saga's row shows the exact path an order took</text>
<text x="226.0" y="366" font-size="10" text-anchor="middle" fill="#10213a">a declined card sends ReleaseStock and the hold returns</text>
<text x="226.0" y="381" font-size="10" text-anchor="middle" fill="#10213a">one correlation ID appears in all five services</text>
<text x="226.0" y="396" font-size="10" text-anchor="middle" fill="#10213a">the hold becomes a deduction only once the order is confirmed</text>
<rect x="452" y="278" width="404" height="142" rx="0" fill="#ffffff" stroke="#9b1c2e" stroke-width="1.8"/>
<rect x="452" y="278" width="404" height="24" fill="#9b1c2e"/>
<line x1="452" y1="302" x2="856" y2="302" stroke="#9b1c2e" stroke-width="1.8"/>
<text x="654.0" y="294" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">what it does not prove</text>
<text x="654.0" y="321" font-size="10" text-anchor="middle" fill="#10213a">no scheduled timeout: a worker that never answers leaves</text>
<text x="654.0" y="336" font-size="10" text-anchor="middle" fill="#10213a">the saga open, which production fixes with Schedule</text>
<text x="654.0" y="351" font-size="10" text-anchor="middle" fill="#10213a">RabbitMQ locally, Azure Service Bus in production</text>
<text x="654.0" y="366" font-size="10" text-anchor="middle" fill="#10213a">no mesh, no ingress, no mutual TLS, no Argo CD</text>
<text x="654.0" y="381" font-size="10" text-anchor="middle" fill="#10213a">no Debezium, so the CDC feed is designed but untested</text>
<text x="654.0" y="396" font-size="10" text-anchor="middle" fill="#10213a">no load test: 70 ms is one request on an idle machine</text>
</svg>
