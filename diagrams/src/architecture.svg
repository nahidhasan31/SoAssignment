<text x="284.0" y="466" font-size="10.5" text-anchor="middle" fill="#10213a">topics with one subscription per service for events</text>
<text x="284.0" y="481" font-size="10.5" text-anchor="middle" fill="#10213a">duplicate detection (10 min) · dead-letter per subscription · sessions off</text>
