<ellipse cx="460.5" cy="297" rx="4.5" ry="3" fill="none" stroke="#1b2a3a" stroke-width="0.9"/>
<text x="469" y="304" font-size="10" text-anchor="start" fill="#5f7183">message log</text>
<rect x="648" y="258" width="208" height="64" fill="#eceff3" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="752.0" y="277" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Recommendation</text>
<text x="752.0" y="294" font-size="10.5" text-anchor="middle" fill="#5f7183">reads the capture feed</text>
<line x1="224" y1="228" x2="224" y2="356" stroke="#b4820e" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-signal)"/>
<line x1="640" y1="228" x2="640" y2="356" stroke="#b4820e" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#m-signal)"/>
<text x="232" y="344" font-size="9" text-anchor="start" fill="#5f7183" font-style="italic">every service publishes and subscribes</text>
<rect x="24" y="360" width="520" height="64" fill="#ffffff" stroke="#b4820e" stroke-width="1.2"/>
<text x="284.0" y="379" font-size="12.5" text-anchor="middle" fill="#b4820e" font-family="Rockwell, Georgia, serif" font-weight="600">Azure Service Bus</text>
<text x="284.0" y="396" font-size="10.5" text-anchor="middle" fill="#5f7183">queues for commands, topics with one subscription per service for events</text>
<text x="284.0" y="410" font-size="10.5" text-anchor="middle" fill="#5f7183">duplicate detection over ten minutes, dead-letter per subscription</text>
<rect x="576" y="360" width="280" height="64" fill="#eceff3" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="716.0" y="379" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Debezium</text>
<text x="716.0" y="396" font-size="10.5" text-anchor="middle" fill="#5f7183">reads the write-ahead log, not the service,</text>
<text x="716.0" y="410" font-size="10.5" text-anchor="middle" fill="#5f7183">so the analytics feed costs checkout nothing</text>
<line x1="576" y1="392" x2="548" y2="392" stroke="#1b2a3a" stroke-width="0.8" stroke-dasharray="1.5 3" marker-end="url(#m-ink)"/>
<text x="544" y="396" font-size="9" text-anchor="end" fill="#5f7183">from the Order and Catalogue write-ahead logs</text>
<line x1="752" y1="360" x2="752" y2="326" stroke="#1b2a3a" stroke-width="0.8" stroke-dasharray="1.5 3" marker-end="url(#m-ink)"/>
<line x1="24" y1="452" x2="856" y2="452" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="474" font-size="12" text-anchor="start" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Azure Kubernetes Service, from month one</text>
<text x="24" y="496" font-size="11" text-anchor="start" fill="#1b2a3a" font-weight="600">Linkerd</text>
<text x="24" y="511" font-size="9.5" text-anchor="start" fill="#5f7183">mutual TLS on every hop inside the boundary</text>
<text x="236" y="496" font-size="11" text-anchor="start" fill="#1b2a3a" font-weight="600">Argo CD</text>
<text x="236" y="511" font-size="9.5" text-anchor="start" fill="#5f7183">the repository is the desired state</text>
<text x="448" y="496" font-size="11" text-anchor="start" fill="#1b2a3a" font-weight="600">Argo Rollouts</text>
<text x="448" y="511" font-size="9.5" text-anchor="start" fill="#5f7183">blue-green, gated by analysis</text>
<text x="660" y="496" font-size="11" text-anchor="start" fill="#1b2a3a" font-weight="600">Dynatrace</text>
<text x="660" y="511" font-size="9.5" text-anchor="start" fill="#5f7183">topology discovered, not configured</text>
<line x1="24" y1="540" x2="58" y2="540" stroke="#1b2a3a" stroke-width="2.6"/>
<text x="66" y="544" font-size="10" text-anchor="start" fill="#5f7183">the checkout path</text>
<line x1="24" y1="557" x2="58" y2="557" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="66" y="561" font-size="10" text-anchor="start" fill="#5f7183">a synchronous call</text>
<line x1="24" y1="574" x2="58" y2="574" stroke="#b4820e" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="66" y="578" font-size="10" text-anchor="start" fill="#5f7183">a message on the broker</text>
<line x1="24" y1="591" x2="58" y2="591" stroke="#1b2a3a" stroke-width="0.8" stroke-dasharray="1.5 3"/>
<text x="66" y="595" font-size="10" text-anchor="start" fill="#5f7183">an observation; the service is not involved</text>
<rect x="560" y="540" width="296" height="38" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="568" y="554" font-size="8.5" text-anchor="start" fill="#5f7183">figure</text>
<text x="568" y="569" font-size="11" text-anchor="start" fill="#1b2a3a">1</text>
<line x1="607.36" y1="540" x2="607.36" y2="578" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="615.36" y="554" font-size="8.5" text-anchor="start" fill="#5f7183">shows</text>
<text x="615.36" y="569" font-size="11" text-anchor="start" fill="#1b2a3a">Platform after twelve months</text>
<line x1="790.88" y1="540" x2="790.88" y2="578" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="798.88" y="554" font-size="8.5" text-anchor="start" fill="#5f7183">revision</text>
<text x="798.88" y="569" font-size="11" text-anchor="start" fill="#1b2a3a">C</text>
