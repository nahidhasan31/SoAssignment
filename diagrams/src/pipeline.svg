<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="Gill Sans, Gill Sans MT, sans-serif">
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#1b2a3a"/></marker><marker id="m-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#7d8c9c"/></marker><marker id="m-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#5f7183"/></marker><marker id="m-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#b4820e"/></marker><marker id="m-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#8c2f22"/></marker></defs>
<rect width="880" height="500" fill="white"/>
<rect x="24" y="24" width="152" height="74" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="100.0" y="43" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Verify</text>
<text x="100.0" y="60" font-size="10.5" text-anchor="middle" fill="#5f7183">format, analysers</text>
<text x="100.0" y="74" font-size="10.5" text-anchor="middle" fill="#5f7183">saga unit tests</text>
<rect x="194" y="24" width="152" height="74" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="270.0" y="43" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Build</text>
<text x="270.0" y="60" font-size="10.5" text-anchor="middle" fill="#5f7183">five images, one file</text>
<text x="270.0" y="74" font-size="10.5" text-anchor="middle" fill="#5f7183">pushed by digest</text>
<line x1="176" y1="61" x2="190" y2="61" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#m-ink)"/>
<rect x="364" y="24" width="152" height="74" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="440.0" y="43" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Integration</text>
<text x="440.0" y="60" font-size="10.5" text-anchor="middle" fill="#5f7183">compose up</text>
<text x="440.0" y="74" font-size="10.5" text-anchor="middle" fill="#5f7183">both failure paths</text>
<line x1="346" y1="61" x2="360" y2="61" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#m-ink)"/>
<rect x="534" y="24" width="152" height="74" fill="#ffffff" stroke="#8c2f22" stroke-width="1.2"/>
<text x="610.0" y="43" font-size="12.5" text-anchor="middle" fill="#8c2f22" font-family="Rockwell, Georgia, serif" font-weight="600">Scan</text>
<text x="610.0" y="60" font-size="10.5" text-anchor="middle" fill="#5f7183">images, packages</text>
<text x="610.0" y="74" font-size="10.5" text-anchor="middle" fill="#5f7183">blocks the release</text>
<line x1="516" y1="61" x2="530" y2="61" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#m-ink)"/>
<rect x="704" y="24" width="152" height="74" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="780.0" y="43" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Promote</text>
<text x="780.0" y="60" font-size="10.5" text-anchor="middle" fill="#5f7183">digests written to the</text>
<text x="780.0" y="74" font-size="10.5" text-anchor="middle" fill="#5f7183">environment repository</text>
<line x1="686" y1="61" x2="700" y2="61" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#m-ink)"/>
<line x1="780" y1="98" x2="780" y2="128" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#m-ink)"/>
<rect x="600" y="132" width="256" height="56" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="728.0" y="151" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Argo CD</text>
<text x="728.0" y="168" font-size="10.5" text-anchor="middle" fill="#5f7183">reconciles the cluster to the repository</text>
<text x="588" y="160" font-size="10" text-anchor="end" fill="#5f7183" font-style="italic">the pipeline holds no cluster credentials at all</text>
<line x1="24" y1="212" x2="856" y2="212" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="238" font-size="13" text-anchor="start" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">Releasing Payment</text>
<text x="24" y="256" font-size="10.5" text-anchor="start" fill="#5f7183">a complete preview, proved before any customer reaches it</text>
<rect x="24" y="274" width="168" height="54" fill="#ffffff" stroke="#1b2a3a" stroke-width="2.6"/>
<text x="108.0" y="293" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">active</text>
<text x="108.0" y="310" font-size="10.5" text-anchor="middle" fill="#5f7183">version N, taking traffic</text>
<rect x="222" y="274" width="168" height="54" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="306.0" y="293" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">preview</text>
<text x="306.0" y="310" font-size="10.5" text-anchor="middle" fill="#5f7183">version N+1, taking none</text>
<text x="207" y="348" font-size="9.5" text-anchor="middle" fill="#5f7183" font-style="italic">two complete environments, side by side</text>
<line x1="390" y1="301" x2="416" y2="301" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#m-ink)"/>
<text x="403.0" y="293.0" font-size="8.5" text-anchor="middle" fill="#5f7183">driven</text>
<rect x="420" y="262" width="196" height="78" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="518.0" y="281" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">AnalysisRun</text>
<text x="518.0" y="298" font-size="10.5" text-anchor="middle" fill="#5f7183">thirty synthetic orders,</text>
<text x="518.0" y="312" font-size="10.5" text-anchor="middle" fill="#5f7183">then p99 and error rate</text>
<text x="518.0" y="326" font-size="10.5" text-anchor="middle" fill="#5f7183">from Dynatrace</text>
<line x1="616" y1="282" x2="646" y2="282" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#m-ink)"/>
<rect x="650" y="262" width="206" height="36" fill="#ffffff" stroke="#1b2a3a" stroke-width="2.6"/>
<text x="753.0" y="281" font-size="12.5" text-anchor="middle" fill="#1b2a3a" font-family="Rockwell, Georgia, serif" font-weight="600">promote</text>
<text x="631.0" y="276.0" font-size="9.5" text-anchor="middle" fill="#1b2a3a">pass</text>
<line x1="616" y1="322" x2="646" y2="322" stroke="#8c2f22" stroke-width="1.2" marker-end="url(#m-fault)"/>
<rect x="650" y="304" width="206" height="36" fill="#ffffff" stroke="#8c2f22" stroke-width="1.2"/>
<text x="753.0" y="323" font-size="12.5" text-anchor="middle" fill="#8c2f22" font-family="Rockwell, Georgia, serif" font-weight="600">abort</text>
<text x="631.0" y="316.0" font-size="9.5" text-anchor="middle" fill="#8c2f22">fail</text>
<text x="856" y="356" font-size="10" text-anchor="end" fill="#5f7183">one atomic switch, and the same switch reversed</text>
<line x1="24" y1="384" x2="856" y2="384" stroke="#7d8c9c" stroke-width="0.8"/>
<text x="24" y="408" font-size="11" text-anchor="start" fill="#1b2a3a">Canary was rejected here: at about forty payments an hour a ten per cent slice is four orders,</text>
<text x="24" y="427" font-size="11" text-anchor="start" fill="#1b2a3a">which is not a sample. Blue-green proves the new version against thirty orders instead.</text>
<text x="24" y="458" font-size="11" text-anchor="start" fill="#5f7183">Change failure rate 31 per cent to under 15. Mean time to restore 112 minutes to under 20.</text>
<rect x="560" y="452" width="296" height="38" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="568" y="466" font-size="8.5" text-anchor="start" fill="#5f7183">figure</text>
<text x="568" y="481" font-size="11" text-anchor="start" fill="#1b2a3a">2</text>
<line x1="607.36" y1="452" x2="607.36" y2="490" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="615.36" y="466" font-size="8.5" text-anchor="start" fill="#5f7183">shows</text>
<text x="615.36" y="481" font-size="11" text-anchor="start" fill="#1b2a3a">Delivery and the Payment release</text>
<line x1="790.88" y1="452" x2="790.88" y2="490" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="798.88" y="466" font-size="8.5" text-anchor="start" fill="#5f7183">revision</text>
<text x="798.88" y="481" font-size="11" text-anchor="start" fill="#1b2a3a">C</text>
</svg>
