<text x="780.0" y="97" font-size="10" text-anchor="middle" fill="#10213a">digests written to the</text>
<text x="780.0" y="112" font-size="10" text-anchor="middle" fill="#10213a">environment repository</text>
<line x1="686" y1="97" x2="702" y2="97" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<text x="440" y="162" font-size="11" text-anchor="middle" fill="#9b1c2e" font-style="italic">the five images built once are the only ones ever deployed; every later stage names them by digest</text>
<line x1="780" y1="138" x2="780" y2="180" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<rect x="600" y="182" width="256" height="62" rx="0" fill="#ffffff" stroke="#16365c" stroke-width="1.8"/>
<rect x="600" y="182" width="256" height="22" fill="#16365c"/>
<line x1="600" y1="204" x2="856" y2="204" stroke="#16365c" stroke-width="1.8"/>
<text x="728.0" y="196" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Argo CD</text>
<text x="728.0" y="223" font-size="10.5" text-anchor="middle" fill="#10213a">sees the new digests and reconciles</text>
<text x="728.0" y="238" font-size="10.5" text-anchor="middle" fill="#10213a">the cluster to match the repository</text>
<rect x="24" y="262" width="832" height="24" fill="#9b1c2e"/>
<text x="440.0" y="279" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Blue-green for Payment, with an automated analysis gate</text>
<rect x="24" y="300" width="832" height="126" rx="0" fill="#eef2f7" stroke="#10213a" stroke-width="1.4"/>
<rect x="48" y="318" width="150" height="54" rx="0" fill="#ffffff" stroke="#16365c" stroke-width="1.8"/>
