<text x="270.0" y="70" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Build</text>
<text x="270.0" y="97" font-size="10" text-anchor="middle" fill="#10213a">five images, one file</text>
<text x="270.0" y="112" font-size="10" text-anchor="middle" fill="#10213a">pushed by digest</text>
<text x="270.0" y="127" font-size="10" text-anchor="middle" fill="#10213a">SBOM + provenance</text>
<line x1="176" y1="97" x2="192" y2="97" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
