<text x="123.0" y="357" font-size="10.5" text-anchor="middle" fill="#10213a">version N</text>
<rect x="238" y="318" width="150" height="54" rx="0" fill="#ffffff" stroke="#1f5d3a" stroke-width="1.8"/>
<rect x="238" y="318" width="150" height="20" fill="#1f5d3a"/>
<line x1="238" y1="338" x2="388" y2="338" stroke="#1f5d3a" stroke-width="1.8"/>
