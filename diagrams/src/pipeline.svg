<text x="313.0" y="357" font-size="10.5" text-anchor="middle" fill="#10213a">version N+1</text>
<line x1="200" y1="345" x2="234" y2="345" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<rect x="428" y="318" width="190" height="90" rx="0" fill="#ffffff" stroke="#10213a" stroke-width="1.8"/>
<rect x="428" y="318" width="190" height="20" fill="#10213a"/>
<line x1="428" y1="338" x2="618" y2="338" stroke="#10213a" stroke-width="1.8"/>
<text x="523.0" y="330" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">AnalysisRun</text>
<text x="523.0" y="357" font-size="10" text-anchor="middle" fill="#10213a">30 synthetic orders against</text>
<text x="523.0" y="372" font-size="10" text-anchor="middle" fill="#10213a">the preview service; p99 and</text>
<text x="523.0" y="387" font-size="10" text-anchor="middle" fill="#10213a">error rate from Dynatrace</text>
<line x1="390" y1="345" x2="424" y2="345" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<rect x="658" y="318" width="174" height="44" rx="0" fill="#ffffff" stroke="#1f5d3a" stroke-width="1.8"/>
<rect x="658" y="318" width="174" height="20" fill="#1f5d3a"/>
<line x1="658" y1="338" x2="832" y2="338" stroke="#1f5d3a" stroke-width="1.8"/>
<text x="745.0" y="330" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">promote</text>
<text x="745.0" y="357" font-size="10.5" text-anchor="middle" fill="#10213a">one atomic switch</text>
<rect x="658" y="372" width="174" height="44" rx="0" fill="#ffffff" stroke="#9b1c2e" stroke-width="1.8"/>
<rect x="658" y="372" width="174" height="20" fill="#9b1c2e"/>
<line x1="658" y1="392" x2="832" y2="392" stroke="#9b1c2e" stroke-width="1.8"/>
<text x="745.0" y="384" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">abort</text>
<text x="745.0" y="411" font-size="10" text-anchor="middle" fill="#10213a">the same switch, reversed</text>
<line x1="620" y1="336" x2="654" y2="336" stroke="#1f5d3a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
<line x1="620" y1="390" x2="654" y2="390" stroke="#9b1c2e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="440" y="450" font-size="11" text-anchor="middle" fill="#5d6b7d" font-style="italic">Canary was rejected for Payment: at roughly 40 payments an hour a five per cent slice is three orders, which proves nothing.</text>
<text x="440" y="468" font-size="11" text-anchor="middle" fill="#5d6b7d" font-style="italic">Continuous delivery, not deployment: the analysis gate decides, and a release manager approves the environment.</text>
<text x="440" y="490" font-size="12" text-anchor="middle" fill="#10213a" font-weight="bold">Change failure rate 31% → under 15%   ·   mean time to restore 112 min → under 20 min</text>
