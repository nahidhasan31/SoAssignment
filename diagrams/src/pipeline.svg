<text x="440.0" y="97" font-size="10" text-anchor="middle" fill="#10213a">compose up --wait</text>
<text x="440.0" y="112" font-size="10" text-anchor="middle" fill="#10213a">both failure paths</text>
<line x1="346" y1="97" x2="362" y2="97" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<rect x="534" y="56" width="152" height="82" rx="0" fill="#ffffff" stroke="#9b1c2e" stroke-width="1.8"/>
