<text x="100.0" y="70" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="bold">Verify</text>
<text x="100.0" y="97" font-size="10" text-anchor="middle" fill="#10213a">dotnet format</text>
<text x="100.0" y="112" font-size="10" text-anchor="middle" fill="#10213a">saga unit tests</text>
<text x="100.0" y="127" font-size="10" text-anchor="middle" fill="#10213a">coverage gate</text>
<rect x="194" y="56" width="152" height="82" rx="0" fill="#ffffff" stroke="#10213a" stroke-width="1.8"/>
