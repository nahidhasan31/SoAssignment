<text x="610.0" y="97" font-size="10" text-anchor="middle" fill="#10213a">Trivy HIGH/CRITICAL</text>
<text x="610.0" y="112" font-size="10" text-anchor="middle" fill="#10213a">vulnerable NuGet</text>
<line x1="516" y1="97" x2="532" y2="97" stroke="#10213a" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
<rect x="704" y="56" width="152" height="82" rx="0" fill="#ffffff" stroke="#10213a" stroke-width="1.8"/>
